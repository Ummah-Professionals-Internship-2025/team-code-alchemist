    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <style>
        body{

        }
        .navbar ul{
            list-style-type: none;
            padding: 0px;

            font-size: 16px;

            top: 0;
            left: 0;

        }

        }

        }

        }

            height: 100%;
            object-fit: cover;
        }
        .title{
            color: white;
            font-size: 42px;
            text-align: left;
            font-family: Poppins;
            position: relative;
            top: 100px;
            right: -150px;
        }
        .subtitle{
            color: white;
            font-size: 21px;
            text-align: left;
            font-weight: 300;
            font-family: Poppins;

            position: relative;
            top: 100px;
            right: -150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
           
            
        }
        a:visited{
            color: white;
        }
        .student{
            position: relative;
            
            top: 200px;
            left: 150px;
            color: #007CA6;
            font-size: 17px;
            font-family: Poppins;
            border-radius: 10px;
            
            font-weight: bold;
border: none;
background: white;
            padding: 10px 20px;
            margin-top: 20px;
            margin-left: 20px;
            margin-right: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            width: 329px;
height: 60px;
flex-shrink: 0;

        }
        .student:hover{

        }

            color: white;
            font-size: 16px;
            font-family: Poppins;
            right: -150px;

<body>
    <nav class="navbar">
