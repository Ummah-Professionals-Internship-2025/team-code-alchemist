<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentor Landing Page</title>
  <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
  <style>
    body{
      margin:0;
      font-family:Poppins, sans-serif;
      background:#003F55;
    }
    .mobile-navbar-open{
      right:0;
      position:fixed;
      top:0;
      width:250px;
      height:100%;
      background-color:#003F55;
      z-index:1000;
      overflow-y:auto;
      padding-top:20px;
    }
    .mobile-navbar-open ul{
      list-style:none;
      font-size:16px;
      font-family:Poppins;
      padding:20px;
      font-weight:bold;
      color:#fff;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .mobile-navbar-open li{
      width:100%;
    }
    .mobile-navbar-open a{
      color:#fff;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      width:100%;
      justify-content:flex-start;
      cursor:pointer;
    }
    /* add tick for all main menu items */
    .mobile-navbar-open > ul > li > a::before{
      content:'›';
      display:inline-block;
      margin-right:8px;
      transition:transform 0.3s ease;
    }
    /* submenu hidden by default */
    .mobile-navbar-open li ul{
      display:none;
      flex-direction:column;
      gap:8px;
      padding-left:20px;
      margin-top:8px;
    }
    /* show submenu when open */
    .mobile-navbar-open li.open > ul{
      display:flex;
    }
    /* rotate arrow only for get involved when open */
    .mobile-navbar-open li.open > a::before{
      transform:rotate(90deg);
    }
    .email{
      color:#fff;
      font-size:16px;
      font-weight:bold;
      margin:2rem;
    }
    .donate-mobile{
      background-color:#FDBB37;
      font-size:1.15rem;
      font-weight:bold;
      color:#00212c;
      width:60%;
      padding:.5rem;
      border-radius:.5rem;
      cursor:pointer;
      margin:1rem auto;
      display:block;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="mobile-navbar-open">
    <ul>
      <li><a href="#">home</a></li>
      <li><a href="#">about</a></li>
      <li>
        <a href="#">get involved</a>
        <ul>
          <li><a href="#">students</a></li>
          <li><a href="#">mentors</a></li>
          <li><a href="#">volunteers</a></li>
        </ul>
      </li>
      <li><a href="#">events</a></li>
      <li><a href="#">contact</a></li>
    </ul>
    <h3 class="email">info@ummahprofessionals.com</h3>
    <button class="donate-mobile">donate</button>
  </div>

  <script>
    document.querySelectorAll('.mobile-navbar-open li').forEach(li=>{
      const sub = li.querySelector('ul');
      const trigger = li.querySelector('a');
      if(trigger){
        trigger.addEventListener('click', e=>{
          if(sub){  // only prevent default + toggle if submenu exists
            e.preventDefault();
            li.classList.toggle('open');
          }
        });
      }
    });
  </script>
</body>
</html>
