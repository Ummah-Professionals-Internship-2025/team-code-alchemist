<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Landing Page</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <style>
        body{
            margin:0;
        }
        .mobile-navbar-open{
            right:0;
            position:fixed;
            top:0;
            width:250px;
            height:100%;
            background-color:#003F55;
            z-index:1000;
            overflow-y:auto;
        }
        .mobile-navbar-open ul{
            list-style:none;
            margin:0;
            padding:30px 20px;
            font-family:Poppins;
            font-weight:bold;
            font-size:16px;
            color:#fff;
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .mobile-navbar-open li{
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:flex-start;
            gap:8px;
        }
        .mobile-navbar-open a{
            text-decoration:none;
            color:#fff;
        }
        .submenu{
            display:none;
            flex-direction:column;
            margin-left:20px;
            gap:8px;
        }
        .submenu-toggle.open + .submenu{
            display:flex;
        }
        .chevron{
            transition:transform 0.3s ease;
        }
        .submenu-toggle.open .chevron{
            transform:rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="mobile-navbar-open">
        <ul>
            <li><span class="chevron">›</span><a href="#">home</a></li>
            <li><span class="chevron">›</span><a href="#">about</a></li>
            <li class="submenu-toggle"><span class="chevron">›</span><a>get involved</a></li>
            <ul class="submenu">
                <li><span class="chevron">›</span><a href="#">students</a></li>
                <li><span class="chevron">›</span><a href="#">professionals</a></li>
                <li><span class="chevron">›</span><a href="#">volunteers</a></li>
            </ul>
            <li><span class="chevron">›</span><a href="#">events</a></li>
            <li><span class="chevron">›</span><a href="#">contact</a></li>
        </ul>
        <h3 style="margin:2rem;color:white;font-family:Poppins;">info@ummahprofessionals.com</h3>
    </div>

    <script>
        document.querySelectorAll(".submenu-toggle").forEach(toggle=>{
            toggle.addEventListener("click",()=>{
                toggle.classList.toggle("open");
            });
        });
    </script>
</body>
</html>
